<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .warning { background: #fff3cd; padding: 15px; border: 1px solid #ffc107; border-radius: 4px; margin-bottom: 20px; }
        form { display: flex; gap: 10px; }
        button { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c82333; }
        a { padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block; }
        a:hover { background: #5a6268; }
    </style>
</head>
<body>
<div class="container">
    <h2>Confirm Delete {{ object_type }}</h2>
    <div class="warning">
        <p><strong>Are you sure you want to delete this {{ object_type|lower }}?</strong></p>
        <p>{{ object }}</p>
        <p style="color: #d9534f;">This action cannot be undone.</p>
    </div>
    <form method="post" style="display: flex; gap: 10px;">
        {% csrf_token %}
        <button type="submit">Delete</button>
        <a href="{% url 'technical' %}">Cancel</a>
    </form>
</div>
</body>
</html>
