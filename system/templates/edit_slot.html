<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Slot</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
        .cancel { background: #6c757d; }
        .cancel:hover { background: #5a6268; }
        a { color: #0d6efd; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>{% if slot %}Edit Training Slot{% else %}Add Training Slot{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display: flex; gap: 10px;">
            <button type="submit">Save</button>
            <a href="{% url 'technical' %}" class="cancel" style="padding: 10px 20px; display: inline-block; border-radius: 4px;">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
